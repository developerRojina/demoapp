name: Android CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 31
          build-tools: 31.0.0
          components: platform-tools,emulator

      # Install system image for the emulator
      - name: Install emulator
        run: |
          sdkmanager "system-images;android-31;default;x86_64"

      # Create and start the emulator
      - name: Create and start emulator
        run: |
          echo "Creating AVD"
          avdmanager create avd -n test --package "system-images;android-31;default;x86_64" --device "pixel"
          echo "Starting AVD"
          nohup emulator -avd test -no-window -no-audio -no-snapshot -no-boot-anim &
          adb wait-for-device
          adb shell input keyevent 82

      # Wait for emulator to be fully booted
      - name: Wait for emulator to boot
        run: |
          EMULATOR_BOOTED=""
          boot_attempts=0
          while [ -z "$EMULATOR_BOOTED" ]; do
            boot_attempts=$((boot_attempts+1))
            EMULATOR_BOOTED=$(adb shell getprop sys.boot_completed | tr -d '\r')
            if [ "$boot_attempts" -gt 30 ]; then
              echo "Emulator failed to boot after 5 minutes."
              exit 1
            fi
            sleep 10
          done
          echo "Emulator is booted."

      # Run Gradle build
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # Run instrumentation tests
      - name: Run instrumentation tests
        run: |
          ./gradlew connectedCheck -Pandroid.testInstrumentationRunnerArguments.class=com.milagrocorp.queue.QueueServiceE2ETest

      # Shutdown emulator after tests
      - name: Shutdown emulator
        run: adb -s emulator-5554 emu kill
