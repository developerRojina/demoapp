name: Android CI with Emulator

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Emulator
        run: |
          docker run -d --name android-emulator \
          -e "RUNNER_VERSION=2.1" \
          -e "ANDROID_HOME=/opt/android-sdk" \
          -p 6080:6080 \
          -v /dev/shm:/dev/shm \
          budtmo/docker-android:x86-11.0

      - name: Wait for Emulator to Boot
        run: |
          echo "Waiting for emulator to boot..."
          for i in {1..30}; do
            if curl -s http://localhost:6080/ > /dev/null; then
              echo "Emulator is up!"
              break
            fi
            sleep 10
          done


      # Build the APKs (app and test APK)
      - name: Build APKs
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleAndroidTest

      # Run the instrumentation tests on the emulator
      - name: Run Instrumentation Tests
        run: |
          ./gradlew connectedAndroidTest

      # Stop and remove the Android emulator container
      - name: Stop and Remove Android Emulator
        run: |
          docker stop android-emulator
          docker rm android-emulator
