name: Run Android Tests with Docker Emulator

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Build the APKs (app and test APK)
      - name: Build APKs
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleAndroidTest

      # Start Android Emulator in Docker
      - name: Start Android Emulator
        uses: docker/setup-buildx-action@v2

      - name: Run Android Emulator in Docker
        run: |
          docker run -d \
            --name android-emulator \
            --device /dev/kvm \
            -e "DEVICE=Pixel_3a_API_30" \
            -e "EMULATOR_ARGS=-no-window -no-boot-anim -gpu swiftshader_indirect" \
            budtmo/docker-android-x86-11.0

      # Wait for the emulator to fully boot
      - name: Wait for Android Emulator to boot
        run: |
          timeout 300s bash -c "until adb shell getprop sys.boot_completed | grep 1; do sleep 5; done"

      # Run the Android instrumentation tests
      - name: Run Instrumentation Tests
        run: |
          ./gradlew connectedAndroidTest

      # Clean up the Docker container
      - name: Stop and Remove Android Emulator
        run: |
          docker stop android-emulator
          docker rm android-emulator
