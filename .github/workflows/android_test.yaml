name: Android CI with Emulator

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Download and start the Android emulator
      - name: Start Android Emulator
        run: |
          docker run -d --name android-emulator \
            -e "ANDROID_SDK_ROOT=/sdk" \
            -e "AVD_NAME=pixel" \
            -e "TARGET_ANDROID_VERSION=30" \
            -e "EMULATOR_ARGS=-no-window -no-audio" \
            us-docker.pkg.dev/android-emulator-prod/emulator/emulator:30.0.26

      # Wait for the Android Emulator to fully boot
      - name: Wait for Android Emulator to Boot
        run: |
          timeout 300s bash -c "until adb shell getprop sys.boot_completed | grep 1; do sleep 5; done"

      # Build the APKs (app and test APK)
      - name: Build APKs
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleAndroidTest

      # Run the instrumentation tests on the emulator
      - name: Run Instrumentation Tests
        run: |
          ./gradlew connectedAndroidTest

      # Stop and remove the Android emulator container
      - name: Stop and Remove Android Emulator
        run: |
          docker stop android-emulator
          docker rm android-emulator
